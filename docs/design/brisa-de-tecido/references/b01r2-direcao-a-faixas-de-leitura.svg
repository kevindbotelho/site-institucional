<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">B-01R2 Direção A — Faixas de leitura</title><desc id="desc">Prancha de exploração com desktop e mobile para seleção expansível de Sofás, Poltronas, Cadeiras e Puffs.</desc>
  <rect width="1600" height="1120" fill="#f2f0e8"/><text x="72" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#567b6d">BRISA DE TECIDO / B-01R2 / O SERVIÇO</text>
  <text x="72" y="132" font-family="Georgia,serif" font-size="48" font-style="italic" fill="#17221f">A — Faixas de leitura</text><text x="72" y="165" font-family="Arial,sans-serif" font-size="17" fill="#567b6d">Seleção direta por peça; a informação se abre sem criar uma galeria de imagens.</text>
  <rect x="72" y="214" width="980" height="650" fill="#17221f"/><text x="104" y="254" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#c8f06b">DESKTOP · ESTADO ATIVO 01</text>
  <text x="104" y="324" font-family="Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#f2f0e8">Cada peça pede uma</text><text x="104" y="374" font-family="Arial,sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#f2f0e8">leitura própria.</text>
  <line x1="104" y1="414" x2="382" y2="414" stroke="#c8f06b" stroke-width="3"/><text x="104" y="455" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">A higienização é avaliada conforme tipo de peça,</text><text x="104" y="479" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">tecido, dimensões e condição atual.</text>
  <rect x="466" y="292" width="544" height="220" fill="#567b6d"/><text x="494" y="337" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c8f06b">01</text><text x="494" y="388" font-family="Georgia,serif" font-size="49" font-style="italic" fill="#f2f0e8">Sofás</text><text x="494" y="428" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">A peça, o tecido, as dimensões e a condição atual</text><text x="494" y="453" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">orientam o primeiro contato.</text><line x1="494" y1="481" x2="978" y2="481" stroke="#c8f06b" stroke-width="3"/>
  <rect x="466" y="530" width="544" height="55" fill="none" stroke="#f2f0e8" stroke-opacity=".55"/><text x="494" y="565" font-family="Arial,sans-serif" font-size="20" fill="#f2f0e8">02  Poltronas</text>
  <rect x="466" y="602" width="544" height="55" fill="none" stroke="#f2f0e8" stroke-opacity=".55"/><text x="494" y="637" font-family="Arial,sans-serif" font-size="20" fill="#f2f0e8">03  Cadeiras</text>
  <rect x="466" y="674" width="544" height="55" fill="none" stroke="#f2f0e8" stroke-opacity=".55"/><text x="494" y="709" font-family="Arial,sans-serif" font-size="20" fill="#f2f0e8">04  Puffs</text>
  <text x="104" y="790" font-family="Arial,sans-serif" font-size="14" letter-spacing="1" fill="#c8f06b">PRIMEIRO CONTATO</text><text x="104" y="819" font-family="Arial,sans-serif" font-size="18" fill="#f2f0e8">Fotos · medidas · bairro</text>
  <rect x="1092" y="214" width="300" height="650" fill="#567b6d"/><text x="1118" y="254" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#c8f06b">MOBILE · ESTADO ATIVO 01</text><text x="1118" y="309" font-family="Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="-1" fill="#f2f0e8">Cada peça pede</text><text x="1118" y="341" font-family="Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="-1" fill="#f2f0e8">uma leitura própria.</text><line x1="1118" y1="370" x2="1280" y2="370" stroke="#c8f06b" stroke-width="3"/>
  <rect x="1118" y="405" width="248" height="166" fill="#17221f"/><text x="1136" y="434" font-family="Arial,sans-serif" font-size="13" fill="#c8f06b">01</text><text x="1136" y="475" font-family="Georgia,serif" font-size="37" font-style="italic" fill="#f2f0e8">Sofás</text><text x="1136" y="510" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">Tecido, dimensões e condição</text><text x="1136" y="531" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">orientam o primeiro contato.</text>
  <text x="1118" y="616" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">02  Poltronas</text><line x1="1118" y1="632" x2="1366" y2="632" stroke="#f2f0e8" stroke-opacity=".5"/><text x="1118" y="676" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">03  Cadeiras</text><line x1="1118" y1="692" x2="1366" y2="692" stroke="#f2f0e8" stroke-opacity=".5"/><text x="1118" y="736" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">04  Puffs</text><text x="1118" y="811" font-family="Arial,sans-serif" font-size="13" fill="#c8f06b">FOTOS · MEDIDAS · BAIRRO</text>
  <line x1="72" y1="934" x2="1528" y2="934" stroke="#567b6d"/><text x="72" y="980" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17221f">MOTION</text><text x="220" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Entrada: linhas surgem em sequência.</text><text x="605" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Clique: faixa ativa alarga e revela texto.</text><text x="1070" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Scroll: sem parallax.</text><text x="72" y="1020" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Reduzido: estado ativo aberto; todos os controles continuam disponíveis por teclado e toque.</text>
</svg>
