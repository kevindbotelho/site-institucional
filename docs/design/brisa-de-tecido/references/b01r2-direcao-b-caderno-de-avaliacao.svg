<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
 <title id="title">B-01R2 Direção B — Caderno de avaliação</title><desc id="desc">Prancha de exploração estática e editorial com desktop e mobile.</desc><rect width="1600" height="1120" fill="#f2f0e8"/>
 <text x="72" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#567b6d">BRISA DE TECIDO / B-01R2 / O SERVIÇO</text><text x="72" y="132" font-family="Georgia,serif" font-size="48" font-style="italic" fill="#17221f">B — Caderno de avaliação</text><text x="72" y="165" font-family="Arial,sans-serif" font-size="17" fill="#567b6d">Uma página de leitura: o método vem antes da lista de peças.</text>
 <rect x="72" y="214" width="980" height="650" fill="#f2f0e8" stroke="#17221f" stroke-width="2"/><text x="108" y="254" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#567b6d">DESKTOP · LEITURA CONTÍNUA</text>
 <text x="108" y="340" font-family="Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-2" fill="#17221f">Antes de cuidar,</text><text x="108" y="395" font-family="Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="-2" fill="#17221f">é preciso entender.</text><line x1="108" y1="440" x2="455" y2="440" stroke="#c8f06b" stroke-width="5"/>
 <text x="108" y="488" font-family="Arial,sans-serif" font-size="18" fill="#17221f">A higienização é avaliada conforme tipo de peça, tecido,</text><text x="108" y="515" font-family="Arial,sans-serif" font-size="18" fill="#17221f">dimensões e condição atual. O primeiro contato reúne o</text><text x="108" y="542" font-family="Arial,sans-serif" font-size="18" fill="#17221f">necessário para orientar o atendimento.</text>
 <line x1="108" y1="616" x2="1015" y2="616" stroke="#17221f" stroke-width="2"/><text x="108" y="659" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" fill="#567b6d">PEÇAS QUE PODEM SER AVALIADAS</text>
 <text x="108" y="733" font-family="Georgia,serif" font-size="39" font-style="italic" fill="#17221f">01  Sofás</text><text x="352" y="733" font-family="Georgia,serif" font-size="39" font-style="italic" fill="#17221f">02  Poltronas</text><text x="660" y="733" font-family="Georgia,serif" font-size="39" font-style="italic" fill="#17221f">03  Cadeiras</text><text x="900" y="733" font-family="Georgia,serif" font-size="39" font-style="italic" fill="#17221f" text-anchor="end">04  Puffs</text>
 <rect x="108" y="776" width="907" height="52" fill="#17221f"/><text x="130" y="808" font-family="Arial,sans-serif" font-size="16" fill="#f2f0e8">PRIMEIRO CONTATO</text><text x="356" y="808" font-family="Arial,sans-serif" font-size="16" fill="#c8f06b">Fotos · medidas · bairro</text>
 <rect x="1092" y="214" width="300" height="650" fill="#17221f"/><text x="1118" y="254" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#c8f06b">MOBILE · LEITURA CONTÍNUA</text><text x="1118" y="314" font-family="Arial,sans-serif" font-size="33" font-weight="700" letter-spacing="-1" fill="#f2f0e8">Antes de cuidar,</text><text x="1118" y="347" font-family="Arial,sans-serif" font-size="33" font-weight="700" letter-spacing="-1" fill="#f2f0e8">é preciso entender.</text><line x1="1118" y1="377" x2="1288" y2="377" stroke="#c8f06b" stroke-width="4"/>
 <text x="1118" y="422" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">Tipo de peça, tecido, dimensões</text><text x="1118" y="443" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">e condição atual orientam a conversa.</text><line x1="1118" y1="488" x2="1366" y2="488" stroke="#f2f0e8" stroke-opacity=".5"/>
 <text x="1118" y="535" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#f2f0e8">01  Sofás</text><text x="1118" y="583" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#f2f0e8">02  Poltronas</text><text x="1118" y="631" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#f2f0e8">03  Cadeiras</text><text x="1118" y="679" font-family="Georgia,serif" font-size="28" font-style="italic" fill="#f2f0e8">04  Puffs</text><rect x="1118" y="736" width="248" height="60" fill="#567b6d"/><text x="1136" y="761" font-family="Arial,sans-serif" font-size="12" letter-spacing="1" fill="#c8f06b">PRIMEIRO CONTATO</text><text x="1136" y="785" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">Fotos · medidas · bairro</text>
 <line x1="72" y1="934" x2="1528" y2="934" stroke="#567b6d"/><text x="72" y="980" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17221f">MOTION</text><text x="220" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Entrada: título e régua assentam juntos.</text><text x="625" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Interação: leitura sem controles adicionais.</text><text x="1080" y="980" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Scroll: lista revela por linha.</text><text x="72" y="1020" font-family="Arial,sans-serif" font-size="16" fill="#17221f">Reduzido: todo o conteúdo nasce visível, sem atraso.</text>
</svg>
