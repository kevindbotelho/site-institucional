 <line x1="72" y1="934" x2="1528" y2="934" stroke="#567b6d"/><text x="72" y="980" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f2f0e8">MOTION</text><text x="220" y="980" font-family="Arial,sans-serif" font-size="16" fill="#f2f0e8">Entrada: pontos se acendem do centro às bordas.</text><text x="700" y="980" font-family="Arial,sans-serif" font-size="16" fill="#f2f0e8">Interação: foco percorre o mapa, sem conteúdo oculto.</text><text x="72" y="1020" font-family="Arial,sans-serif" font-size="16" fill="#f2f0e8">Scroll: o trilho permanece discreto. Reduzido: pontos e conteúdo estáticos, todos visíveis.</text>
