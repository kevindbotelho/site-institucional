 <title id="title">B-01R2 Direção C — Mapa de contato</title><desc id="desc">Prancha de exploração com desktop e mobile que organiza as peças como um mapa de conversa.</desc><rect width="1600" height="1120" fill="#17221f"/>
 <text x="72" y="70" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#c8f06b">BRISA DE TECIDO / B-01R2 / O SERVIÇO</text><text x="72" y="132" font-family="Georgia,serif" font-size="48" font-style="italic" fill="#f2f0e8">C — Mapa de contato</text><text x="72" y="165" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">A lista vira um pequeno mapa: peça, leitura e o que ajuda a orientar a conversa.</text>
 <rect x="72" y="214" width="980" height="650" fill="#21302c"/><text x="104" y="254" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#c8f06b">DESKTOP · MAPA EM QUATRO PONTOS</text><text x="104" y="332" font-family="Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2" fill="#f2f0e8">O cuidado começa</text><text x="104" y="383" font-family="Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2" fill="#f2f0e8">pela conversa certa.</text><text x="104" y="430" font-family="Arial,sans-serif" font-size="17" fill="#f2f0e8">A higienização é avaliada conforme tipo de peça, tecido, dimensões e condição atual.</text>
