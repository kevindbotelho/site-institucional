 <text x="148" y="670" font-family="Arial,sans-serif" font-size="14" fill="#c8f06b">01</text><text x="148" y="710" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#f2f0e8">Sofás</text><text x="360" y="670" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">02</text><text x="360" y="710" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#f2f0e8">Poltronas</text><text x="572" y="670" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">03</text><text x="572" y="710" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#f2f0e8">Cadeiras</text><text x="784" y="670" font-family="Arial,sans-serif" font-size="14" fill="#f2f0e8">04</text><text x="784" y="710" font-family="Georgia,serif" font-size="34" font-style="italic" fill="#f2f0e8">Puffs</text>
