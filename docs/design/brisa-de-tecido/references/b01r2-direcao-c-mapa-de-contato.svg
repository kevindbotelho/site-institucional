 <rect x="1092" y="214" width="300" height="650" fill="#f2f0e8"/><text x="1118" y="254" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#567b6d">MOBILE · MAPA VERTICAL</text><text x="1118" y="314" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-1" fill="#17221f">O cuidado começa</text><text x="1118" y="347" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-1" fill="#17221f">pela conversa certa.</text><text x="1118" y="390" font-family="Arial,sans-serif" font-size="14" fill="#17221f">Peça, tecido, dimensões e condição</text><text x="1118" y="411" font-family="Arial,sans-serif" font-size="14" fill="#17221f">atual guiam a avaliação.</text>
